name: dotnet build & test

on:
  push:
    branches: [ "main" ]
    paths:
      - '**'
      - '!.github/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**'
      - '!.github/**'

permissions:
  contents: read
  issues: read
  checks: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: csbe-course/actions@main
